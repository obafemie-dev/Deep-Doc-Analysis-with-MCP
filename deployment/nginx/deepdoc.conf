# ============================================================================
# Nginx Reverse Proxy Configuration for Deep-Doc-Analysis
# ============================================================================
#
# INSTALLATION LOCATION:
#   Copy to: /etc/nginx/sites-available/deepdoc
#   Symlink: ln -s /etc/nginx/sites-available/deepdoc /etc/nginx/sites-enabled/
#
# BEFORE SSL SETUP:
#   1. Replace 'yourdomain.com' with your actual domain
#   2. Test: nginx -t
#   3. Reload: systemctl reload nginx
#
# AFTER CERT BOT SSL SETUP:
#   Certbot will automatically modify this file to add SSL configuration
#
# ============================================================================

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - Main Application
server {
    # HTTPS Configuration
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificate Paths (Certbot will fill these in)
    # After running: certbot certonly --nginx -d yourdomain.com -d www.yourdomain.com
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL Configuration (Manual setup before Certbot)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stytch.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://api.anthropic.com https://api.stytch.com wss://$server_name; frame-ancestors 'none';" always;

    # Logging
    access_log /var/log/nginx/deepdoc_access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/deepdoc_error.log warn;

    # Max file upload size (matches backend MAX_FILE_SIZE)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;  # 5 minutes for long-running AI queries

    # ========================================================================
    # Backend API Routes (FastAPI)
    # ========================================================================
    location /api/ {
        # Proxy to backend container
        proxy_pass http://127.0.0.1:8000;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for SSE streaming
        proxy_buffering off;
        proxy_cache off;

        # HTTP/1.1 for streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts for streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Rate limiting for API endpoints
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    # ========================================================================
    # SSE Streaming Endpoint (Special handling)
    # ========================================================================
    location /api/v1/chat/stream {
        # Proxy to backend container
        proxy_pass http://127.0.0.1:8000;

        # Essential headers for SSE
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Critical: Disable all buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # HTTP/1.1 required for streaming
        proxy_http_version 1.1;

        # SSE-specific headers
        proxy_set_header X-Accel-Buffering no;

        # Long timeout for streaming (10 minutes max)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Chunked transfer encoding
        chunked_transfer_encoding on;

        # Rate limiting (more restrictive for chat)
        limit_req zone=chat burst=5 nodelay;
        limit_req_status 429;
    }

    # ========================================================================
    # File Upload Endpoint (Special handling)
    # ========================================================================
    location /api/v1/upload {
        # Proxy to backend container
        proxy_pass http://127.0.0.1:8000;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload-specific settings
        client_max_body_size 50M;
        client_body_timeout 300s;

        # Timeouts for large file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Rate limiting (stricter for uploads)
        limit_req zone=upload burst=3 nodelay;
        limit_req_status 429;
    }

    # ========================================================================
    # Health Check Endpoint (no rate limiting)
    # ========================================================================
    location /health {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Short timeout for health checks
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;

        access_log off;  # Don't log health checks
    }

    # ========================================================================
    # Frontend Static Files (React SPA)
    # ========================================================================
    location / {
        # Proxy to frontend container (Nginx serving static files)
        proxy_pass http://127.0.0.1:3000;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Caching for static assets
        proxy_cache_bypass $http_upgrade;

        # Short timeouts for static files
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
        gzip_comp_level 6;
    }

    # ========================================================================
    # Static Asset Caching (Frontend build artifacts)
    # ========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;

        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================================
    # Deny access to sensitive files
    # ========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================================
# Rate Limiting Zones (defined in nginx.conf or http block)
# ============================================================================
#
# Add these to /etc/nginx/nginx.conf in the http { } block:
#
# # API Rate Limiting
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
#
# # Chat Endpoint Rate Limiting (more restrictive)
# limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;
#
# # Upload Endpoint Rate Limiting (most restrictive)
# limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
#
# # Connection Limiting
# limit_conn_zone $binary_remote_addr zone=addr:10m;
#
# ============================================================================

# ============================================================================
# DEPLOYMENT INSTRUCTIONS
# ============================================================================
#
# 1. Copy this file to Nginx sites-available:
#    sudo cp deepdoc.conf /etc/nginx/sites-available/deepdoc
#
# 2. Update domain name (replace yourdomain.com):
#    sudo nano /etc/nginx/sites-available/deepdoc
#
# 3. Add rate limiting zones to nginx.conf:
#    sudo nano /etc/nginx/nginx.conf
#    (Add the limit_req_zone lines from above to http block)
#
# 4. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/deepdoc /etc/nginx/sites-enabled/
#
# 5. Test Nginx configuration:
#    sudo nginx -t
#
# 6. Reload Nginx:
#    sudo systemctl reload nginx
#
# 7. Obtain SSL certificate with Certbot:
#    sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# 8. Verify auto-renewal:
#    sudo certbot renew --dry-run
#
# 9. Test HTTPS:
#    curl -I https://yourdomain.com
#    curl -I https://yourdomain.com/api/v1/health
#
# ============================================================================
