version: '3.8'

services:
  # Ollama service for running LLM (DISABLED - Using Claude API)
  # Uncomment below if you want to use Ollama instead of Claude
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: deep-doc-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s

  # Backend FastAPI service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deep-doc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./backend/app:/app/app  # For development hot-reload
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - UPLOAD_DIR=/app/uploads
    # depends_on:
    #   - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend React service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: deep-doc-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

# volumes:
#   ollama_data:
#     driver: local

networks:
  default:
    name: deep-doc-network
