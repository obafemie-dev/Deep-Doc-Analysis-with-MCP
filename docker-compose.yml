version: '3.8'

services:
  # Ollama service for running LLM
  ollama:
    image: ollama/ollama:latest
    container_name: deep-doc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Backend FastAPI service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deep-doc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./backend/app:/app/app  # For development hot-reload
      - analytics_db:/app  # Shared volume for analytics.db
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - UPLOAD_DIR=/app/uploads
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend React service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deep-doc-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  # Metabase Analytics Dashboard (localhost only)
  metabase:
    image: metabase/metabase:latest
    container_name: deep-doc-metabase
    ports:
      - "127.0.0.1:3001:3000"  # Only accessible from host machine
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
      - analytics_db:/analytics:ro  # Mount analytics DB as read-only
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
  metabase_data:
    driver: local
  analytics_db:
    driver: local

networks:
  default:
    name: deep-doc-network
